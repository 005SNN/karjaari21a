<script type="module">
// Walk-through viewer for the baked house model (three.js).
// Everything is unlit: colour = albedo texture x light baked in Blender/Cycles (lightmaps or vertex colours),
// so it runs on cheap phones. Config comes from window.WALK (written by publish/web3d.py).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const C = window.WALK;
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const LOW = q.get('q') === 'lo' || (q.get('q') !== 'hi' &&
  ((navigator.deviceMemory || 8) <= 4 || (navigator.hardwareConcurrency || 8) <= 4));
const T = (x, y, z = 0) => new THREE.Vector3(x, z, -y);        // Blender (z up) -> three (y up)
const EXPO_OUT = 0.5, EXPO_IN = 1.4;

// ------------------------------------------------------------------ renderer, scene
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !LOW, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, LOW ? 1 : 1.75));
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = EXPO_OUT;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 3000);

async function unpack(src) {           // previews: the .glb travels inside a lossless PNG
  const img = new Image(); img.src = src; await img.decode();
  const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height;
  const g = cv.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, cv.width, cv.height).data, n = cv.width * cv.height, b = new Uint8Array(n * 3);
  for (let i = 0, j = 0; i < n; i++) { b[j++] = d[4 * i]; b[j++] = d[4 * i + 1]; b[j++] = d[4 * i + 2]; }
  const len = b[0] | (b[1] << 8) | (b[2] << 16) | (b[3] << 24);
  return URL.createObjectURL(new Blob([b.subarray(4, 4 + len)], { type: 'model/gltf-binary' }));
}

const progress = { done: 0, total: 0 };
function step(label) {
  progress.done++;
  $('bar').style.width = `${Math.round(100 * progress.done / progress.total)}%`;
  if (label) $('msg').textContent = label;
}

// ------------------------------------------------------------------ model
async function loadModel() {
  const tl = new THREE.TextureLoader();
  const tex = async (url, srgb = true, flip = false) => {
    const t = await tl.loadAsync(url);
    t.flipY = flip; t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.anisotropy = LOW ? 1 : 4;
    return t;
  };
  progress.total = 2 + Object.keys(C.lightmaps).length;
  const sky = await tex(C.sky, true, true);
  sky.mapping = THREE.EquirectangularReflectionMapping;
  scene.background = sky;
  scene.backgroundIntensity = C.sky_scale;
  step('Taevas');
  const lms = {};
  for (const [k, v] of Object.entries(LOW ? C.lightmaps_lo : C.lightmaps)) {
    lms[k] = await tex(v); lms[k].channel = 1; step('Valgus');
  }
  const loader = new GLTFLoader();
  if (!C.packed) loader.setDRACOLoader(new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/'));
  const gltf = await loader.loadAsync(C.packed ? await unpack(C.model) : C.model);
  step('Mudel');
  const lmI = C.lm_scale * Math.PI;    // MeshBasicMaterial divides the light map by PI
  const warm = new THREE.Color(1.0, 0.86, 0.66).multiplyScalar(4);
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    const src = o.material, [key, mode] = src.name.split('|');
    const map = src.map || null, base = map ? new THREE.Color(1, 1, 1) : src.color.clone();
    let m;
    if (mode === 'hidden') { o.visible = false; return; } // compatibility with older exports
    if (mode === 'glass') {
      m = new THREE.MeshBasicMaterial({ color: key === 'saunaklaas' ? 0x5a4030 : 0x18242a, transparent: true,
        opacity: 0.32, envMap: sky, reflectivity: 0.3, combine: THREE.MixOperation, depthWrite: false,
        side: THREE.DoubleSide });
    } else if (mode === 'emit') {
      m = new THREE.MeshBasicMaterial({ color: warm });
    } else if (mode === 'const') {
      m = new THREE.MeshBasicMaterial({ map, color: base.multiply(new THREE.Color(...C.lawn_light)) });
    } else if (mode.startsWith('lm')) {
      m = new THREE.MeshBasicMaterial({ map, color: base, vertexColors: true, lightMap: lms[mode.slice(2)],
        lightMapIntensity: lmI });
    } else {                           // 'vc' / 'dark': light is in the vertex colours
      m = new THREE.MeshBasicMaterial({ map, color: base.multiplyScalar(C.vc_scale), vertexColors: true });
    }
    if (q.get('debug') === 'mat') {     // one flat colour per material, to see what is what
      let h = 0; for (const ch of src.name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      m = new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL((h % 360) / 360, 0.7, 0.5) });
      console.log('mat', src.name, '#' + m.color.getHexString());
    }
    src.dispose();
    o.material = m;
    o.matrixAutoUpdate = false;
  });
  scene.add(gltf.scene);
}

// ------------------------------------------------------------------ controls
const orbit = new OrbitControls(camera, canvas);
orbit.enableDamping = true;
orbit.minDistance = 0.2; orbit.maxDistance = 70;
orbit.zoomToCursor = true;             // scroll/pinch towards a window and you zoom into the house
orbit.maxPolarAngle = Math.PI * 0.495;
function startEye() {                  // portrait screens: step back so the whole house fits
  const eye = T(...C.start.eye), target = T(...C.start.target);
  const k = camera.aspect < 1 ? Math.min(1.9, 1 / Math.pow(camera.aspect, 0.75)) : 1;
  return [eye.sub(target).multiplyScalar(k).add(target), target];
}

let tween = null, activeRoom = '';

function fov(indoor = activeRoom !== '') {
  const a = camera.aspect;
  return indoor ? (a >= 1 ? 66 : 80) : (a >= 1 ? 45 : 62);
}

function flyTo(pos, quat, fovTo, done) {
  tween = { p0: camera.position.clone(), q0: camera.quaternion.clone(), f0: camera.fov,
    p1: pos, q1: quat, f1: fovTo, t: 0, done };
}

function enterRoom(room) {             // room button: fly in, then orbit around the room's middle
  const [bx, by] = room.spawn, [lookX, lookY] = room.look, floor = C.floor_z || 0;
  const eye = T(bx, by, floor + 1.6), target = T((bx + lookX) / 2, (by + lookY) / 2, floor + 1.3);
  const m = new THREE.Matrix4().lookAt(eye, target, new THREE.Vector3(0, 1, 0));
  orbit.enabled = false;
  flyTo(eye, new THREE.Quaternion().setFromRotationMatrix(m), fov(true), () => {
    orbit.target.copy(target); orbit.maxPolarAngle = Math.PI * 0.85; orbit.enabled = true; orbit.update();
  });
  selectRoom(room.id);
}

function showExterior() {
  orbit.enabled = false;
  const [eye, target] = startEye();
  const m = new THREE.Matrix4().lookAt(eye, target, new THREE.Vector3(0, 1, 0));
  flyTo(eye, new THREE.Quaternion().setFromRotationMatrix(m), fov(false), () => {
    orbit.target.copy(target); orbit.maxPolarAngle = Math.PI * 0.495; orbit.enabled = true; orbit.update();
  });
  selectRoom('');
}

function inRing(x, y, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function inPolygon(x, y, geometry) {
  const polygons = geometry.type === 'Polygon' ? [geometry.coordinates] : geometry.coordinates;
  return polygons.some((rings) => inRing(x, y, rings[0]) && !rings.slice(1).some((hole) => inRing(x, y, hole)));
}

function exposureAt(p) {             // per-room exposure (from the baked floor light), outdoors fixed
  const [x0, y0, x1, y1] = C.house, x = p.x, y = -p.z;
  if (!(x > x0 && x < x1 && y > y0 && y < y1 && p.y < (C.floor_z || 0) + 3.2)) return EXPO_OUT;
  const z = C.zones.find((r) => x > r[0] && x < r[2] && y > r[1] && y < r[3] &&
    (!r[5] || inPolygon(x, y, r[5])));
  return z ? z[4] : EXPO_IN;
}

// ------------------------------------------------------------------ UI
function selectRoom(room) {
  activeRoom = room;
  document.querySelectorAll('#rooms button').forEach((b) => b.classList.toggle('on', b.dataset.room === room));
  $('hint').textContent = matchMedia('(pointer:coarse)').matches
    ? 'Lohista = pööra · Kaks sõrme = suumi (ka majja sisse) · vali tuba allpool'
    : 'Lohista = pööra · Rull = suumi (ka majja sisse) · Paremklõps = nihuta · vali tuba allpool';
}

function buildRooms() {
  const bar = $('rooms');
  const add = (label, room, fn) => {
    const b = document.createElement('button'); b.textContent = label; b.dataset.room = room;
    b.onclick = fn; bar.appendChild(b);
  };
  add('Väljast', '', showExterior);
  for (const r of C.rooms) add(r.name, r.id, () => enterRoom(r));
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  if (!tween) camera.fov = fov();
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ------------------------------------------------------------------ loop
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / 0.9);
    const s = tween.t * tween.t * (3 - 2 * tween.t);
    camera.position.lerpVectors(tween.p0, tween.p1, s);
    camera.quaternion.slerpQuaternions(tween.q0, tween.q1, s);
    camera.fov = tween.f0 + (tween.f1 - tween.f0) * s; camera.updateProjectionMatrix();
    if (tween.t >= 1) { const d = tween.done; tween = null; d && d(); }
  } else orbit.update();
  const target = exposureAt(camera.position);
  renderer.toneMappingExposure += (target - renderer.toneMappingExposure) * Math.min(1, dt * 2.5);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

buildRooms();
selectRoom('');
resize();
{ const [eye, target] = startEye(); camera.position.copy(eye); orbit.target.copy(target); orbit.update(); }
