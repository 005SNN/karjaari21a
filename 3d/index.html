<script>
(() => {
  const stage = document.querySelector('.stage');
  const timer = setTimeout(() => fail('3D-vaade ei käivitunud. Vaata maja pildilt või ava 360° tuur.'), 12000);
  function fail(message) {
    clearTimeout(timer);
    stage.classList.remove('ready');
    stage.classList.add('fallback');
    document.getElementById('c').tabIndex = -1;
    document.getElementById('msg').textContent = message ||
      '3D-vaadet ei saa selles brauseris avada. Vaata maja pildilt või ava 360° tuur.';
    window.READY = true;
  }
  window.WALK_BOOT = { started: () => clearTimeout(timer), fail };
})();

<script type="module">
// Walk-through viewer for the baked house model (three.js).
// Everything is unlit: colour = albedo texture x light baked in Blender/Cycles (lightmaps or vertex colours),
// so it runs on cheap phones. Config comes from window.WALK (written by publish/web3d.py).
// Dynamic imports let the classic bootstrap report blocked/missing modules too.
window.WALK_BOOT.started();
async function startViewer() {
  // Give the inline house poster a paint before WebGL initialization can occupy the CPU.
  await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const [THREE, { GLTFLoader }, { DRACOLoader }, { OrbitControls }, assetsToLoad] = await Promise.all([
    import('three'), import('three/addons/loaders/GLTFLoader.js'),
    import('three/addons/loaders/DRACOLoader.js'), import('three/addons/controls/OrbitControls.js'),
    window.WALK_ASSETS,
  ]);

  const C = window.WALK;
  const $ = (id) => document.getElementById(id);
  const LOW = assetsToLoad.low;
  const T = (x, y, z = 0) => new THREE.Vector3(x, z, -y);        // Blender (z up) -> three (y up)
  const EXPO_OUT = 0.5, EXPO_IN = 1.4;

  // ------------------------------------------------------------------ renderer, scene
  const canvas = $('c');
  $('model-fullscreen').addEventListener('click', async () => {
    try { if (document.fullscreenElement) await document.exitFullscreen(); else await $('model').requestFullscreen(); }
    catch (_) { $('room-status').textContent = 'Täisekraan pole selles brauseris saadaval.'; }
  });
  document.addEventListener('fullscreenchange', () => {
    $('model-fullscreen').textContent = document.fullscreenElement ? 'Välju täisekraanist' : 'Ava täisekraan';
    resize();
  });
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: !LOW, powerPreference: 'high-performance' });
  canvas.addEventListener('webglcontextlost', (event) => {
    event.preventDefault();
    window.WALK_BOOT.fail();
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.toneMapping = THREE.AgXToneMapping;
  renderer.toneMappingExposure = EXPO_OUT;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 3000);

  async function unpack(src) {           // previews: the .glb travels inside a lossless PNG
    const img = new Image(); img.src = src; await img.decode();
    const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height;
    const g = cv.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, cv.width, cv.height).data, n = cv.width * cv.height, b = new Uint8Array(n * 3);
    for (let i = 0, j = 0; i < n; i++) { b[j++] = d[4 * i]; b[j++] = d[4 * i + 1]; b[j++] = d[4 * i + 2]; }
    const len = b[0] | (b[1] << 8) | (b[2] << 16) | (b[3] << 24);
    return URL.createObjectURL(new Blob([b.subarray(4, 4 + len)], { type: 'model/gltf-binary' }));
  }

  const progress = { done: 0, total: 0 };
  function step(label) {
    if (canvas.closest('.stage').classList.contains('fallback')) return;
    progress.done++;
    const percent = Math.round(100 * progress.done / progress.total);
    $('bar').style.transform = `scaleX(${percent / 100})`;
    $('bar').parentElement.setAttribute('aria-valuenow', percent);
    if (label) $('msg').textContent = `Laen 3D-mudelit… ${percent} %`;
  }

  // ------------------------------------------------------------------ model
  const tl = new THREE.TextureLoader();
  const tex = async (url, srgb = true, flip = false) => {
      let t;
      try { t = await tl.loadAsync(url); }
      catch (error) {
        const jpeg = assetsToLoad.fallback[url];
        if (!jpeg) throw error;
        t = await tl.loadAsync(jpeg);
      }
      t.flipY = flip; t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
      t.anisotropy = LOW ? 1 : Math.min(16, renderer.capabilities.getMaxAnisotropy());
      return t;
  };

  async function loadModel() {
    const maps = assetsToLoad.maps;
    progress.total = 2 + Object.keys(maps).length;
    const loader = new GLTFLoader();
    const draco = C.packed ? null : new DRACOLoader().setDecoderPath(C.draco);
    // Draco stays off the main thread; bound worker memory on phones.
    if (draco) { draco.setWorkerLimit(Math.min(navigator.hardwareConcurrency || 2, 4)); draco.preload(); }
    if (draco) loader.setDRACOLoader(draco);
    // All independent scene downloads start together.
    let assets;
    try {
      assets = await Promise.all([
        tex(assetsToLoad.sky, true, true).then((t) => { step('Taevas'); return t; }),
        Promise.all(Object.entries(maps).map(async ([k, v]) => {
          const t = await tex(v); t.channel = 1; step('Valgus'); return [k, t];
        })),
        (async () => {
          const url = C.packed ? await unpack(assetsToLoad.model) : assetsToLoad.model;
          try { const gltf = await loader.loadAsync(url); step('Mudel'); return gltf; }
          finally { if (C.packed) URL.revokeObjectURL(url); }
        })(),
      ]);
    } finally { draco?.dispose(); }
    const [sky, lightmaps, gltf] = assets;
    sky.mapping = THREE.EquirectangularReflectionMapping;
    scene.background = sky;
    scene.backgroundIntensity = C.sky_scale;
    const lms = Object.fromEntries(lightmaps);
    const lmI = C.lm_scale * Math.PI;    // MeshBasicMaterial divides the light map by PI
    const warm = new THREE.Color(1.0, 0.86, 0.66).multiplyScalar(4);
    gltf.scene.traverse((o) => {
      if (!o.isMesh) return;
      const src = o.material, [key, mode] = src.name.split('|');
      const map = src.map || null, base = map ? new THREE.Color(1, 1, 1) : src.color.clone();
      let m;
      if (mode === 'hidden') { o.visible = false; return; } // compatibility with older exports
      if (mode === 'glass') {
        m = new THREE.MeshBasicMaterial({ color: key === 'saunaklaas' ? 0x5a4030 : 0x18242a, transparent: true,
          opacity: 0.32, envMap: sky, reflectivity: 0.3, combine: THREE.MixOperation, depthWrite: false,
          side: THREE.DoubleSide });
      } else if (mode === 'emit') {
        m = new THREE.MeshBasicMaterial({ color: warm });
      } else if (mode === 'const') {
        m = new THREE.MeshBasicMaterial({ map, color: base.multiply(new THREE.Color(...C.lawn_light)) });
      } else if (mode.startsWith('lm')) {
        m = new THREE.MeshBasicMaterial({ map, color: base, vertexColors: true, lightMap: lms[mode.slice(2)],
          lightMapIntensity: lmI });
      } else {                           // 'vc' / 'dark': light is in the vertex colours
        m = new THREE.MeshBasicMaterial({ map, color: base.multiplyScalar(C.vc_scale), vertexColors: true });
      }
      src.dispose();
      m.userData.key = key;
      o.material = m;
      o.matrixAutoUpdate = false;
    });
    scene.add(gltf.scene);
    // Compile before revealing the canvas; avoid a shader stall on the first orbit.
    if (renderer.compileAsync) await renderer.compileAsync(scene, camera);
  }

  // ------------------------------------------------------------------ controls
  const orbit = new OrbitControls(camera, canvas);
  orbit.enableDamping = true;
  orbit.minDistance = 0.2; orbit.maxDistance = 70;
  orbit.zoomToCursor = true;             // scroll/pinch towards a window and you zoom into the house
  orbit.maxPolarAngle = Math.PI * 0.495;
  canvas.addEventListener('keydown', (event) => {
    if (!orbit.enabled || event.altKey || event.ctrlKey || event.metaKey) return;
    const offset = camera.position.clone().sub(orbit.target);
    if (event.shiftKey && event.key.startsWith('Arrow')) {
      const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
      const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
      const delta = new THREE.Vector3();
      const distance = Math.max(0.1, offset.length() * 0.06);
      if (event.key === 'ArrowLeft') delta.addScaledVector(right, -distance);
      if (event.key === 'ArrowRight') delta.addScaledVector(right, distance);
      if (event.key === 'ArrowUp') delta.addScaledVector(up, distance);
      if (event.key === 'ArrowDown') delta.addScaledVector(up, -distance);
      camera.position.add(delta); orbit.target.add(delta); orbit.update();
      event.preventDefault(); return;
    }
    const s = new THREE.Spherical().setFromVector3(offset);
    switch (event.key) {
      case 'ArrowLeft': s.theta -= 0.12; break;
      case 'ArrowRight': s.theta += 0.12; break;
      case 'ArrowUp': s.phi -= 0.10; break;
      case 'ArrowDown': s.phi += 0.10; break;
      case '+': case '=': s.radius *= 0.85; break;
      case '-': case '_': s.radius /= 0.85; break;
      default: return;
    }
    event.preventDefault();
    s.phi = THREE.MathUtils.clamp(s.phi, orbit.minPolarAngle, orbit.maxPolarAngle);
    s.radius = THREE.MathUtils.clamp(s.radius, orbit.minDistance, orbit.maxDistance);
    s.makeSafe();
    camera.position.copy(orbit.target).add(offset.setFromSpherical(s));
    orbit.update();
  });
  function startEye() {                  // portrait screens: step back so the whole house fits
    const eye = T(...C.start.eye), target = T(...C.start.target);
    const k = camera.aspect < 1 ? Math.min(1.9, 1 / Math.pow(camera.aspect, 0.75)) : 1;
    return [eye.sub(target).multiplyScalar(k).add(target), target];
  }

  let tween = null, activeRoom = '';

  function fov(indoor = activeRoom !== '') {
    const a = camera.aspect;
    return indoor ? (a >= 1 ? 66 : 80) : (a >= 1 ? 45 : 62);
  }

  function flyTo(pos, quat, fovTo, done) {
    if (matchMedia('(prefers-reduced-motion:reduce)').matches) {
      tween = null; camera.position.copy(pos); camera.quaternion.copy(quat);
      camera.fov = fovTo; camera.updateProjectionMatrix(); done?.(); return;
    }
    tween = { p0: camera.position.clone(), q0: camera.quaternion.clone(), f0: camera.fov,
      p1: pos, q1: quat, f1: fovTo, t: 0, done };
  }

  function enterRoom(room) {             // room button: fly in, then orbit around the room's middle
    const [bx, by] = room.spawn, [lookX, lookY] = room.look, floor = C.floor_z || 0;
    const eye = T(bx, by, floor + 1.6), target = T((bx + lookX) / 2, (by + lookY) / 2, floor + 1.3);
    const m = new THREE.Matrix4().lookAt(eye, target, new THREE.Vector3(0, 1, 0));
    orbit.enabled = false;
    flyTo(eye, new THREE.Quaternion().setFromRotationMatrix(m), fov(true), () => {
      orbit.target.copy(target); orbit.maxPolarAngle = Math.PI * 0.85; orbit.enabled = true; orbit.update();
    });
    selectRoom(room.id);
  }

  function showExterior() {
    orbit.enabled = false;
    const [eye, target] = startEye();
    const m = new THREE.Matrix4().lookAt(eye, target, new THREE.Vector3(0, 1, 0));
    flyTo(eye, new THREE.Quaternion().setFromRotationMatrix(m), fov(false), () => {
      orbit.target.copy(target); orbit.maxPolarAngle = Math.PI * 0.495; orbit.enabled = true; orbit.update();
    });
    selectRoom('');
  }

  function inRing(x, y, ring) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }

  function inPolygon(x, y, geometry) {
    const polygons = geometry.type === 'Polygon' ? [geometry.coordinates] : geometry.coordinates;
    return polygons.some((rings) => inRing(x, y, rings[0]) && !rings.slice(1).some((hole) => inRing(x, y, hole)));
  }

  function exposureAt(p) {             // per-room exposure (from the baked floor light), outdoors fixed
    const [x0, y0, x1, y1] = C.house, x = p.x, y = -p.z;
    if (!(x > x0 && x < x1 && y > y0 && y < y1 && p.y < (C.floor_z || 0) + 3.2)) return EXPO_OUT;
    const z = C.zones.find((r) => x > r[0] && x < r[2] && y > r[1] && y < r[3] &&
      (!r[5] || inPolygon(x, y, r[5])));
    return z ? z[4] : EXPO_IN;
  }

  // ------------------------------------------------------------------ UI
  function selectRoom(room, updateURL = true) {
    activeRoom = room;
    if (updateURL) {
      const url = new URL(location.href);
      if (room) url.searchParams.set('ruum', room); else url.searchParams.delete('ruum');
      if (url.href !== location.href) history.pushState(null, '', url);
    }
    document.querySelectorAll('#rooms button').forEach((b) => {
      const selected = b.dataset.room === room;
      b.classList.toggle('on', selected);
      b.setAttribute('aria-pressed', String(selected));
      if (selected) $('room-status').textContent = `Valitud vaade: ${b.textContent}`;
    });
    $('hint').textContent = matchMedia('(pointer:coarse)').matches
      ? 'Pööramiseks lohista. Suumimiseks kasuta kahte sõrme. Vali vaatamiseks ruum.'
      : 'Pööramiseks lohista või kasuta nooleklahve. Suumi hiirerulli, plussklahvi või miinusklahviga. Nihutamiseks lohista parema hiirenupuga või hoia tõstuklahvi ja vajuta nooleklahvi.';
  }

  function buildRooms() {
    const bar = $('rooms');
    const add = (label, room, fn) => {
      const b = document.createElement('button'); b.textContent = label; b.dataset.room = room;
      b.type = 'button'; b.className = 'control';
      b.addEventListener('focus', () => b.scrollIntoView({block: 'nearest', inline: 'nearest'}));
      b.onclick = fn; bar.appendChild(b);
    };
    add('Väljast', '', showExterior);
    for (const r of C.rooms) add(r.name, r.id, () => enterRoom(r));
  }

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    if (!tween) camera.fov = fov();
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  new ResizeObserver(resize).observe(canvas.parentElement);

  // ------------------------------------------------------------------ loop
  const clock = new THREE.Clock();
  function frame() {
    if (canvas.closest('.stage').classList.contains('fallback')) return;
    const dt = Math.min(clock.getDelta(), 0.1);
    if (tween) {
      tween.t = Math.min(1, tween.t + dt / 0.9);
      const s = tween.t * tween.t * (3 - 2 * tween.t);
      camera.position.lerpVectors(tween.p0, tween.p1, s);
      camera.quaternion.slerpQuaternions(tween.q0, tween.q1, s);
      camera.fov = tween.f0 + (tween.f1 - tween.f0) * s; camera.updateProjectionMatrix();
      if (tween.t >= 1) { const d = tween.done; tween = null; d && d(); }
    } else orbit.update();
    const target = exposureAt(camera.position);
    renderer.toneMappingExposure += (target - renderer.toneMappingExposure) * Math.min(1, dt * 2.5);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  resize();
  { const [eye, target] = startEye(); camera.position.copy(eye); orbit.target.copy(target); orbit.update(); }
  await loadModel();
  if (canvas.closest('.stage').classList.contains('fallback')) return;
  buildRooms();
  selectRoom('', false);
  const openLocation = () => {
    const requested = new URLSearchParams(location.search).get('ruum');
    const deep = C.rooms.find((r) => r.id === requested || r.name === requested);
    if (deep) { enterRoom(deep); tween && (tween.t = 1); }
    else showExterior();
  };
  openLocation();
  addEventListener('popstate', openLocation);
  frame();
  canvas.closest('.stage').classList.add('ready');
  canvas.tabIndex = 0;
  window.VIEW = { THREE, scene, camera, orbit, renderer };   // stable handle for automated visual checks
  window.READY = true;
  swapDetail(THREE, scene, tex, assetsToLoad.detail || {});
  loadGarden(THREE, scene, C, tex, GLTFLoader, DRACOLoader, LOW)
    .catch((err) => console.warn('3D-vaade: aed jäi laadimata', err));
}

// ------------------------------------------------------------------ garden
// The photographic garden as real-time stand-ins (blender/web_garden.py): every tree and plant
// a camera-facing card rendered from the same prototype, at the same place; 3D grass tufts on
// the lawn and hay outside the fence; the photographed lawn texture; the fence and beds.
// Sprite texel = radiance / LM_SCALE, so cards and baked surfaces share one exposure.
async function loadGarden(THREE, scene, C, tex, GLTFLoader, DRACOLoader, LOW) {
  const G = C.garden;
  if (!G) return;
  const data = await (await fetch(G.json)).json();
  const T = (x, y, z = 0) => new THREE.Vector3(x, z, -y);
  const radiance = C.lm_scale;
  const sunAz = data.sun[0] * Math.PI / 180, sunEl = data.sun[1] * Math.PI / 180;
  const away = new THREE.Vector2(-Math.cos(sunAz), Math.sin(sunAz));   // shadow direction, Blender x/y
  const rnd = ((seed) => () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646)(7);
  // all pictures download together; the lawn photo and the fence with them
  const maps = Object.fromEntries(await Promise.all(Object.entries(G.sprites).map(
    async ([name, url]) => [name, await tex(url, true, true).catch(() => null)])));
  const byName = {};
  for (const [name, x, y, z, s, sz] of data.instances) (byName[name] ||= []).push([x, y, z, s, sz]);

  // camera-facing cards (cylindrical billboards): the trunk stays vertical
  const card = (map) => new THREE.ShaderMaterial({
    uniforms: { map: { value: map }, gain: { value: radiance } },
    vertexShader: `varying vec2 vUv;
      void main() {
        vUv = uv;
        vec3 c = (modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
        float sx = length(instanceMatrix[0].xyz), sy = length(instanceMatrix[1].xyz);
        vec3 d = cameraPosition - c; d.y = 0.0;
        d = length(d) > 1e-4 ? normalize(d) : vec3(0.0, 0.0, 1.0);
        vec3 p = c + vec3(d.z, 0.0, -d.x) * position.x * sx + vec3(0.0, position.y * sy, 0.0);
        gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
      }`,
    fragmentShader: `uniform sampler2D map; uniform float gain; varying vec2 vUv;
      void main() {
        vec4 t = texture2D(map, vUv);
        if (t.a < 0.5) discard;
        gl_FragColor = vec4(t.rgb * gain, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  });
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v3 = new THREE.Vector3();
  const blobs = [];
  for (const [name, places] of Object.entries(byName)) {
    const sp = data.sprites[name], map = maps[name];
    if (!sp || !map) continue;
    const geo = new THREE.PlaneGeometry(sp.w, sp.h).translate(0, sp.h / 2 + sp.z0, 0);
    const mesh = new THREE.InstancedMesh(geo, card(map), places.length);
    places.forEach(([x, y, z, s, sz], i) => {
      mesh.setMatrixAt(i, m4.compose(T(x, y, z), q, v3.set(s, sz, s)));
      if (Math.hypot(x - C.center[0], y - C.center[1]) < 90) blobs.push([x, y, z, sp.w * s * 0.5, sp.h * sz]);
    });
    mesh.frustumCulled = false;
    scene.add(mesh);
  }

  // soft ground shadows of the trees and shrubs, cast away from the bake's sun
  if (blobs.length) {
    const cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const g = cv.getContext('2d'), grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(0,0,0,1)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
    const mat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), color: 0x000000, transparent: true,
      opacity: 0.42, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
    const mesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), mat, blobs.length);
    const yaw = Math.atan2(-away.y, away.x);
    blobs.forEach(([x, y, z, r, h], i) => {
      const length = Math.min(h / Math.tan(sunEl) * 0.55, 4 * r + 2), mid = length / 2;
      q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
      mesh.setMatrixAt(i, m4.compose(T(x + away.x * mid, y + away.y * mid, z + 0.02), q, v3.set(length + r, 1, 2 * r)));
    });
    mesh.frustumCulled = false;
    mesh.renderOrder = -1;
    scene.add(mesh);
  }

  // grass tufts on the lawn, hay in the meadow strip and beyond the fence
  const { mergeGeometries } = await import('three/addons/utils/BufferGeometryUtils.js');
  const sampler = (tris, near) => {
    const areas = [];
    let total = 0;
    for (let i = 0; i < tris.length; i += 9) {
      const [ax, ay, , bx, by, , cx, cy] = tris.slice(i, i + 9);
      total += Math.abs((bx - ax) * (cy - ay) - (cx - ax) * (by - ay)) / 2;
      areas.push(total);
    }
    return () => {
      for (let tries = 0; tries < 20; tries++) {
        const pick = rnd() * total;
        let k = areas.findIndex((a) => a >= pick);
        k = Math.max(0, k) * 9;
        let u = rnd(), w = rnd();
        if (u + w > 1) { u = 1 - u; w = 1 - w; }
        const p = [0, 1, 2].map((j) => tris[k + j] + u * (tris[k + 3 + j] - tris[k + j]) + w * (tris[k + 6 + j] - tris[k + j]));
        if (Math.hypot(p[0] - C.center[0], p[1] - C.center[1]) < near) return p;
      }
      return null;
    };
  };
  const tufts = (kind, tris, count, near) => {
    const names = Object.keys(data.sprites).filter((n) => data.sprites[n].kind === kind && maps[n]);
    if (!names.length || !tris.length) return;
    const pick = sampler(tris, near);
    names.forEach((name) => {
      const sp = data.sprites[name], map = maps[name];
      const a = new THREE.PlaneGeometry(sp.w, sp.h).translate(0, sp.h / 2 + sp.z0, 0);
      const geo = mergeGeometries([a, a.clone().rotateY(Math.PI / 2)]);
      const mat = new THREE.MeshBasicMaterial({ map, alphaTest: 0.5, side: THREE.DoubleSide,
        color: new THREE.Color(radiance, radiance, radiance) });
      const n = Math.round(count / names.length), mesh = new THREE.InstancedMesh(geo, mat, n);
      let placed = 0;
      for (let i = 0; i < n; i++) {
        const p = pick();
        if (!p) continue;
        const s = 0.75 + 0.5 * rnd();
        q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * Math.PI);
        mesh.setMatrixAt(placed++, m4.compose(T(p[0], p[1], p[2]), q, v3.set(s, s * (0.8 + 0.4 * rnd()), s)));
      }
      mesh.count = placed;
      mesh.frustumCulled = false;
      scene.add(mesh);
    });
  };
  tufts('meadow', data.meadow, LOW ? 3000 : 10000, 75);

  // mown lawn: real blades, 3.5–7.5 cm, in clumps as in environment.grass_clump; albedo x the lawn's light
  {
    const pick = sampler(data.lawn, 32), pos = [], col = [];
    const tones = [[.040, .085, .016], [.062, .125, .025], [.085, .155, .034], [.115, .175, .048],
                   [.090, .135, .045], [.070, .115, .030], [.20, .18, .075], [.16, .115, .055]];
    for (let k = 0; k < 18; k++) {
      const a = rnd() * Math.PI * 2, r = 0.09 * Math.sqrt(rnd()), h = 0.035 + 0.04 * rnd(), b = 0.012 + 0.033 * rnd();
      const x = Math.cos(a) * r, z = -Math.sin(a) * r, wx = -Math.sin(a) * 0.004, wz = -Math.cos(a) * 0.004;
      pos.push(x - wx, 0, z - wz, x + wx, 0, z + wz, x + Math.cos(a) * b, h, z - Math.sin(a) * b);
      const t = tones[k % tones.length], base = 0.7 + 0.3 * rnd();
      for (let i = 0; i < 3; i++) col.push(...t.map((c, j) => c * C.lawn_light[j] * (i === 2 ? 1.15 : base)));
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    const n = LOW ? 4000 : 12000;
    const mesh = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }), n);
    let placed = 0;
    for (let i = 0; i < n; i++) {
      const p = pick();
      if (!p) continue;
      const s = 0.8 + 0.5 * rnd();
      q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * Math.PI * 2);
      mesh.setMatrixAt(placed++, m4.compose(T(p[0], p[1], p[2]), q, v3.set(s, s, s)));
    }
    mesh.count = placed;
    mesh.frustumCulled = false;
    scene.add(mesh);
  }

  // the photographed lawn on the ground: world-scale texture, two scales against tiling, hay outside the plot
  const lawnMap = await tex(G.lawn, true, true);
  lawnMap.wrapS = lawnMap.wrapT = THREE.RepeatWrapping;
  const [px0, py0, px1, py1] = data.plot || [-3, -8.5, 19.5, 45];
  scene.traverse((o) => {
    const m = o.material;
    if (!o.isMesh || !m || m.userData.key !== 'muru') return;
    m.map = lawnMap;
    m.onBeforeCompile = (shader) => {
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vGround;')
        .replace('#include <project_vertex>', '#include <project_vertex>\nvGround = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vGround;')
        .replace('#include <map_fragment>', `
          vec2 gp = vec2(vGround.x, -vGround.z);
          vec3 g = mix(texture2D(map, gp / 1.7).rgb, texture2D(map, gp / 7.3 + 0.37).rgb, 0.4);
          vec2 qd = abs(gp - vec2(${(px0 + px1) / 2}, ${(py0 + py1) / 2})) - vec2(${(px1 - px0) / 2}, ${(py1 - py0) / 2});
          g *= mix(vec3(1.0), vec3(1.25, 1.08, 0.72), smoothstep(0.0, 4.0, max(qd.x, qd.y)));
          diffuseColor.rgb *= g;`);
    };
    m.needsUpdate = true;
  });

  // fence and beds: plain colours lit like the far lawn
  const loader = new GLTFLoader();
  if (!C.packed) loader.setDRACOLoader(new DRACOLoader().setDecoderPath(C.draco));
  const gltf = await loader.loadAsync(G.glb);
  const light = new THREE.Color(...C.lawn_light);
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    const src = o.material;
    o.material = new THREE.MeshBasicMaterial({ color: src.color.clone().multiply(light), side: THREE.DoubleSide });
    src.dispose();
  });
  scene.add(gltf.scene);
  window.GARDEN_READY = true;
}

// Full-resolution scanned albedos (wood grain, parquet) replace the first-paint copies once the house is shown.
async function swapDetail(THREE, scene, tex, detail) {
  for (const [key, url] of Object.entries(detail)) {
    let t;
    try { t = await tex(url); } catch (_) { continue; }    // the first-paint texture simply stays
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    scene.traverse((o) => {
      const m = o.material;
      if (o.isMesh && m.map && m.userData.key === key) { m.map = t; m.needsUpdate = true; }
    });
  }
  window.DETAIL_READY = true;
}
startViewer().catch((err) => { window.WALK_BOOT.fail(); console.error('3D-vaade:', err); });

</script></body></html>
